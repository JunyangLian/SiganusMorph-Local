<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }

      #wrap {
        display: inline-block;
        line-height: 0;
        position: relative;
      }

      #target {
        cursor: crosshair;
        display: block;
        height: auto;
        max-width: 100%;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <img id="target" alt="clickable specimen image" draggable="false" />
    </div>

    <script>
      const COMPONENT_READY = "streamlit:componentReady";
      const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
      const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
      const RENDER = "streamlit:render";
      const image = document.getElementById("target");

      function post(message) {
        window.parent.postMessage({ isStreamlitMessage: true, ...message }, "*");
      }

      function setFrameHeight() {
        const height = Math.ceil(document.documentElement.scrollHeight || image.height || 0);
        post({ type: SET_FRAME_HEIGHT, height });
      }

      function render(args) {
        image.src = args.image_data;
        image.style.width = `${args.width}px`;
        image.width = args.width;
        image.height = args.height;
        setFrameHeight();
      }

      image.addEventListener("load", setFrameHeight);
      image.addEventListener("click", (event) => {
        const rect = image.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * image.width;
        const y = ((event.clientY - rect.top) / rect.height) * image.height;
        post({
          type: SET_COMPONENT_VALUE,
          value: {
            x,
            y,
            width: image.width,
            height: image.height,
            timestamp: Date.now(),
          },
        });
      });

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== RENDER) {
          return;
        }
        render(event.data.args || {});
      });

      post({ type: COMPONENT_READY, apiVersion: 1 });
      setFrameHeight();
    </script>
  </body>
</html>
